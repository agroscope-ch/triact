description:
  en:
    localisedName: triact
    shortDescription: Software to analyze the lying behavior of cows from accelerometer data.
    longDescription: "Assists in analyzing the lying behavior of cows from raw data
      recorded with a triaxial accelerometer attached to the hind leg of a cow.
      Allows the determination of common measures for lying behavior including
      total lying duration, the number of lying bouts, and the mean duration of
      lying bouts. Further capabilities are the description of lying laterality
      and the calculation of proxies for the level of physical activity of the
      cow. Reference: Simmler M., Brouwers S. P. (2024)
      <doi:10.7717/peerj.17036>."
    documentation: https://cran.r-project.org/web/packages/triact/vignettes/introduction.html
    apiDocumentation: https://cran.r-project.org/web/packages/triact/refman/triact.html
    features:
      - Analyzing the lying behavior of cows from triaxial accelerometer data.
      - Determination of total lying duration, the number of lying bouts, and
        the mean duration of lying bouts.
      - Determination of lying laterality.
      - Calculation of proxies for the level of physical activity.
